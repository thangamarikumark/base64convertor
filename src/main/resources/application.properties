spring.application.name=convert2base64
logging.level.org.springframework.web.client.RestTemplate=INFO

# ─── Runtime configuration (12-factor: env vars are the primary mechanism) ───
# server.port / management.server.port, plus file.cache.path, app.base64.output-path,
# and LOG_DIR (log4j2-spring.xml) below are ALL overridable via environment
# variables with sensible Linux defaults baked in — no properties file edit or
# rebuild required to run this same jar/image in any environment. See the full
# configuration matrix in docs/Configuration.md.
server.port=${SERVER_PORT:8080}

# Empty by default (no context path — every controller mapping is reachable at
# its literal path, e.g. /api/files/pdf/protect). Set CONTEXT_PATH when a
# fronting reverse proxy only forwards one fixed path prefix and can't be
# reconfigured (e.g. an nginx `location /api/files/convert/ { proxy_pass ...; }`
# block with no rewrite, which forwards the full original URI unchanged) — every
# existing endpoint then becomes reachable at CONTEXT_PATH + its current path,
# e.g. with CONTEXT_PATH=/api/files/convert, /api/files/pdf/protect becomes
# /api/files/convert/api/files/pdf/protect. Does not affect the separate
# management/actuator port. See docs/Configuration.md.
server.servlet.context-path=${CONTEXT_PATH:}


# ─── TLS (optional, opt-in) ───────────────────────────────────────────────────
# Disabled by default so existing plain-HTTP deployments are unaffected. Set
# SSL_ENABLED=true and point SSL_KEYSTORE_PATH at a real PKCS12 keystore to
# terminate TLS directly on this app's embedded Tomcat (as an alternative to
# terminating TLS at a reverse proxy/load balancer in front of it). All four
# values are env-var driven — no rebuild required. See docs/Configuration.md.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:/etc/base64convertor/tls/keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}

# ─── API observability / correlation ──────────────────────────────────────────
# Value emitted on the X-API-Version response header for every request (see
# RequestCorrelationFilter). Single source of truth — change here, not per-controller.
app.api.version=1.0.0

# ─── Public base URL ──────────────────────────────────────────────────────────
# Scheme+host+port this service is actually reachable at from the outside, e.g.
# https://api.example.com. Used to build every downloadLink returned to callers
# (POST /callback, POST /save-decoded). MUST be set in any non-local deployment —
# left blank, download-link builders fall back to http://localhost:<server.port>,
# which only resolves on the machine running the server itself.
app.public-base-url=${PUBLIC_BASE_URL:}

# ─── Max file size (in-memory processing endpoints) ──────────────────────────
# Applies to POST /convert, /convert/single, and /save-decoded — endpoints that
# read/hold a full file in memory before writing it out. Independent of
# pdf.protection.max-file-size-mb (/pdf/protect) and app.pdf.stream-threshold-bytes
# (PDF dynamic fetch), which enforce their own caps on their own endpoints.
app.max-file-size-mb=${MAX_FILE_SIZE_MB:20}

# ─── Default auth / content type ────────────────────────────────────────────
app.default.auth.token=q4ynVHA2s4d3unfWY2ujrQ==
app.default.content.type=application/json

# ─── HTTP Client ─────────────────────────────────────────────────────────────
app.http.connect-timeout-seconds=30
app.http.response-timeout-seconds=60
app.http.max-connections=200
app.http.max-connections-per-route=20
# Applies to all outbound downloads (POST /api/files/convert and /convert/single
# fetch remote files over http:// or https://; PDF fetch does too). No SSL/TLS
# termination is configured on this server (server.ssl.enabled=false) — this
# property is unrelated to that; it's about the certs on the *remote* https://
# source URLs we download from, not this app's own listener. When true, https://
# sources with self-signed/internal/expired certs are still downloaded (strict
# cert validation is not mandatory here); http:// sources are unaffected either
# way. Set to false only if strict CA-signed cert validation on the remote side
# becomes a requirement.
app.http.trust-all-ssl=true

# ─── PDF / File conversion ───────────────────────────────────────────────────
# Files larger than this byte threshold return FILE_TOO_LARGE instead of Base64
app.pdf.stream-threshold-bytes=5000000

# ─── PDF password protection (POST /api/files/pdf/protect) ──────────────────────
# Kill-switch; when false, the endpoint fails fast with HTTP 503.
pdf.protection.enabled=true
# Maximum accepted decoded PDF size, in megabytes.
pdf.protection.max-file-size-mb=20
# Filename used in the Content-Disposition header of the returned attachment.
pdf.protection.default-filename=protected_document.pdf

# ─── Bandhan PDF statement field extraction (POST /api/files/convert/pdf/bandhan/protect) ────
# Label text to search for when best-effort extracting statement fields from the decoded PDF's
# text content (see BandhanStatementFieldExtractor / LabeledFieldExtractor). A field whose label
# isn't found in the document is returned as null; extraction never fails the request. Add new
# entries here to support additional fields (e.g. Customer Name, Policy Number) with no Java
# code changes — reuses pdf.protection.enabled / pdf.protection.max-file-size-mb for the
# enabled kill-switch and size limit, since the underlying protection mechanism is identical to
# POST /api/files/convert/pdf/protect.
pdf.bandhan.field-labels.statementDate=Statement Date
pdf.bandhan.field-labels.totalAmountDue=Total Amount Due
pdf.bandhan.field-labels.minimumAmountDue=Minimum Amount Due
pdf.bandhan.field-labels.paymentDueDate=Payment Due Date
# Search window: only the first N non-blank lines of extracted text are scanned, cut short at
# the first line containing any section-boundary marker below — keeps extraction confined to
# the statement header and away from labels that legitimately repeat later (transaction table
# headings, page-2 illustrative examples).
pdf.bandhan.max-scan-lines=30
pdf.bandhan.section-boundary-
markers[0]=Statement Summary

# ─── Batch conversion ────────────────────────────────────────────────────────
# Maximum number of files accepted in a single /convert batch request
app.convert.max-batch-size=50

# ─── URL Allowlist (SSRF protection) ─────────────────────────────────────────
# http/https scheme is always enforced. Set allowlist-enabled=true to also
# restrict the allowed hostnames.
app.url.allowlist-enabled=false
# Comma-separated permitted hostnames (only used when allowlist-enabled=true)
# Example: app.url.allowed-hosts=api.partner.com,files.internal.com
app.url.allowed-hosts=

# ─── Retry ───────────────────────────────────────────────────────────────────
# Total attempts per call (1 = no retry)
app.retry.max-attempts=3
# Milliseconds to wait before the first retry
app.retry.initial-delay-ms=1000
# Each subsequent retry delay is multiplied by this factor
app.retry.multiplier=2.0

# ─── Async thread pool ───────────────────────────────────────────────────────
async.file-executor.core-pool-size=4
async.file-executor.max-pool-size=8
async.file-executor.queue-capacity=50

# ─── Actuator / Prometheus (Grafana) ─────────────────────────────────────────
# Expose health, info and prometheus scrape endpoint
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
# Separate port so /actuator/prometheus is not on the public API port
management.server.port=${MANAGEMENT_PORT:9090}
# Explicitly independent of server.ssl.enabled — Spring Boot otherwise silently
# inherits TLS on the management port too, which then fails startup (or, worse,
# succeeds by picking up an unrelated stray keystore if one happens to exist on
# the host) whenever the public API port is switched to TLS but no separate
# management keystore was configured. Kept plain HTTP by default since this
# port is meant for internal-only scraping; opt in explicitly if needed.
management.server.ssl.enabled=${MANAGEMENT_SSL_ENABLED:false}
# Tag every metric with the application name for easy Grafana filtering
management.metrics.tags.application=${spring.application.name}
# Enable per-endpoint HTTP request metrics (latency, status codes per path)
management.metrics.web.server.request.autotime.enabled=true
management.metrics.web.server.request.autotime.percentiles=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ─── Base64 file output ───────────────────────────────────────────────────────
# Set to false to disable writing Base64 to disk (log preview only)
app.base64.output-enabled=true
# Directory where .b64 files are written. Overridable via the BASE64_OUTPUT_PATH
# environment variable on any host/container without editing this file or
# rebuilding the jar — see docs/Configuration.md for the full path matrix.
app.base64.output-path=${BASE64_OUTPUT_PATH:/var/lib/base64convertor/base64-output}
# .b64 files older than this many days are deleted by the hourly cleanup
app.base64.retention-days=7

# ─── Decoded file retention (POST /save-decoded output) ──────────────────────
# Decoded files (and their .meta.json sidecars) written to app.base64.output-path older than
# this many days are deleted by the hourly + startup cleanup. Independent of
# app.base64.retention-days — see docs/Production_Readiness_Review.md, P0-3.
app.decoded-file.retention-days=7

# ─── File cache ───────────────────────────────────────────────────────────────
# Overridable via the FILE_CACHE_PATH environment variable on any host/container
# without editing this file or rebuilding the jar — see docs/Configuration.md.
file.cache.path=${FILE_CACHE_PATH:/var/lib/base64convertor/file-cache}
file.cache.retention-hours=24
file.cache.audit.rotation-enabled=true
file.cache.audit.archive-enabled=true
file.cache.audit.archive-retention-days=7
