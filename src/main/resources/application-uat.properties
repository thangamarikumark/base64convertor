# ─── Logging levels — UAT / SIT / Staging (activate with spring.profiles.active=uat) ──────────
# Per docs/LoggingPolicy.md: INFO is for operational events only — no payload/body content is
# ever logged at INFO regardless of this setting (enforced in code, not by level alone).
logging.level.root=WARN
logging.level.com.twixor.base64convertor=INFO
logging.level.httpLogger=INFO
# The dedicated HTTP request/response logger (LoggingInterceptor, PdfService) is actually
# registered under this name in log4j2-spring.xml, routed to logs/http.log — set alongside
# the "httpLogger" key above so the level takes effect regardless of which name is checked.
logging.level.com.twixor.base64convertor.http=INFO
# log4j2-spring.xml also defines a dedicated, more-specific logger for the pdf package
# (routed to logs/pdf.log). A more-specific named logger always wins over the broader
# "com.twixor.base64convertor" setting above, so it must be set explicitly here too.
# (This happens to already match the XML's own default of INFO for this environment, but
# is set explicitly for consistency and to avoid relying on that coincidence.)
logging.level.com.twixor.base64convertor.pdf=INFO
