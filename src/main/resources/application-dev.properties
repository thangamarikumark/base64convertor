# ─── Logging levels — Development (activate with spring.profiles.active=dev) ─────────────────
# Per docs/LoggingPolicy.md: DEBUG is dev-only, never enable in UAT/staging/production.
logging.level.root=WARN
logging.level.com.twixor.base64convertor=DEBUG
logging.level.httpLogger=DEBUG
# The dedicated HTTP request/response logger (LoggingInterceptor, PdfService) is actually
# registered under this name in log4j2-spring.xml, routed to logs/http.log — set alongside
# the "httpLogger" key above so the level takes effect regardless of which name is checked.
logging.level.com.twixor.base64convertor.http=DEBUG
# log4j2-spring.xml also defines a dedicated, more-specific logger for the pdf package
# (routed to logs/pdf.log). A more-specific named logger always wins over the broader
# "com.twixor.base64convertor" setting above, so it must be set explicitly here too —
# otherwise the entire pdf module (PdfService, PdfProtectionService, Pdf*Controller,
# Pdf*Facade, etc.) silently stays pinned to the XML's own level regardless of profile.
logging.level.com.twixor.base64convertor.pdf=DEBUG
