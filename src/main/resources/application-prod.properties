# ─── Logging levels — Production (activate with spring.profiles.active=prod) ──────────────────
# Per docs/LoggingPolicy.md: ERROR only — failures/exceptions, no request/response payloads,
# no Base64/PDF content, no passwords/secrets/tokens, no PII.
logging.level.root=ERROR
logging.level.com.twixor.base64convertor=ERROR
logging.level.httpLogger=ERROR
# The dedicated HTTP request/response logger (LoggingInterceptor, PdfService) is actually
# registered under this name in log4j2-spring.xml, routed to logs/http.log — set alongside
# the "httpLogger" key above so the level takes effect regardless of which name is checked.
logging.level.com.twixor.base64convertor.http=ERROR
# log4j2-spring.xml also defines a dedicated, more-specific logger for the pdf package
# (hardcoded to level="INFO", routed to logs/pdf.log). A more-specific named logger always
# wins over the broader "com.twixor.base64convertor" setting above — without this explicit
# override, the entire pdf module (PdfService, PdfProtectionService, Pdf*Controller,
# Pdf*Facade, etc.) would keep logging at INFO in production regardless of the setting
# above. See docs/logging-review-remediation-report.md, Finding 2.
logging.level.com.twixor.base64convertor.pdf=ERROR
